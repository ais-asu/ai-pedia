name: Release

# Publishes a GitHub release for the version in package.json when it has none yet.
# The tag is v<version>; the notes are that version's section of CHANGELOG.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release if the tag does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released"
            exit 0
          fi
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            /^## / && on { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $version" >&2
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
